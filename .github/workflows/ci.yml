name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guitar
          POSTGRES_PASSWORD: guitar
          POSTGRES_DB: guitar_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guitar -d guitar_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Create test database extras
        run: |
          PGPASSWORD=guitar psql -h localhost -U guitar -d guitar_ai_test -c "SELECT 1"

      - name: Run Go tests
        working-directory: backend
        env:
          GO_ENV: test
          DATABASE_URL_TEST: postgresql://guitar:guitar@localhost:5432/guitar_ai_test
          JWT_SECRET: ci-test-jwt-secret
        run: |
          go run ./cmd/server migrate
          go test ./... -count=1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Run Flutter web tests
        working-directory: frontend/apps/app_web
        run: flutter pub get && flutter analyze && flutter test

      - name: Run Flutter mobile tests
        working-directory: frontend/apps/app_mobile
        run: flutter pub get && flutter analyze && flutter test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guitar
          POSTGRES_PASSWORD: guitar
          POSTGRES_DB: guitar_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guitar -d guitar_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Playwright E2E
        env:
          GO_ENV: test
          DATABASE_URL: postgresql://guitar:guitar@localhost:5432/guitar_ai_test
          JWT_SECRET: ci-e2e-jwt-secret
        run: chmod +x scripts/e2e.sh && make e2e-test
