# app = "your-guitar-ai-api"  # set after: fly apps create guitar-ai-api

primary_region = "sin"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PORT = "5000"
  MIGRATIONS_DIR = "/app/migrations"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
