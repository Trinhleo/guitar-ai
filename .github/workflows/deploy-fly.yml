name: Deploy Fly API

on:
  workflow_dispatch:
    inputs:
      fly_app:
        description: Fly.io app name
        required: true
        default: guitar-ai-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy API to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: fly deploy -c fly.toml -a "${{ inputs.fly_app }}"

      - name: Health check
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: fly curl /health -a "${{ inputs.fly_app }}"
