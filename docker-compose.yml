services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: guitar
      POSTGRES_PASSWORD: guitar
      POSTGRES_DB: guitar_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guitar -d guitar_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://guitar:guitar@postgres:5432/guitar_ai
      JWT_SECRET: dev-docker-jwt-secret
      PORT: "5000"
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "./server migrate && ./server"

  web:
    build:
      context: ./frontend
      args:
        API_BASE_URL: ""
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
