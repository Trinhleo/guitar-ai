services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: guitar
      POSTGRES_PASSWORD: guitar
      POSTGRES_DB: guitar_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guitar -d guitar_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
